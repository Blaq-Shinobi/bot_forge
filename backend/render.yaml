services:
  - type: web
    name: botforge-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false  # set manually in the Render dashboard - never commit this value
      - key: PAYSTACK_SECRET_KEY
        sync: false  # required for webhook signature verification to work at all
